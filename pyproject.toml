[project]
name = "project"
version = "0.1.0"
description = "이벤트 인지형 서울 주요 거점 교통 상황 예측 및 드리프트 대응 서비스"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.0",
    "fastapi==0.141.1",
    "mlflow==3.16.0",
    "numpy==2.4.4",
    "openpyxl>=3.1",
    "pandas>=3.0",
    "pyarrow>=25.0.1",
    "pydantic==2.13.3",
    "python-calamine>=0.8.2",
    "python-multipart==0.0.20",
    "pyyaml>=6.0",
    "requests==2.33.1",
    "ruff>=0.16.9",
    "tensorflow==2.21.0",
    "uvicorn[standard]==0.46.0",
]

[project.scripts]
project = "project:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
