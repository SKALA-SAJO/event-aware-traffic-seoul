# 실시간 수집: 15분마다 corridor 링크 속도·돌발 정보를 받아 data-collect 브랜치의 CSV 에 추가합니다.
# (비공개 저장소일 때는 Actions 무료 한도(월 2,000분) 때문에 30분 간격이었고, 공개 저장소로 바꾸며 15분으로 되돌림.
#  시간대마다 스냅숏 최대 4회 → import_collected.py 는 2회 이상 모인 시간대를 평균. 30분 시절 시간대(2회)도 그대로 반영됨)
# 실제 실행은 cron-job.org 가 15분마다 workflow_dispatch 로 호출합니다. 아래 schedule 은 보조입니다.
# 같은 실행에서 오늘·내일 KBO·K리그 경기 상태도 다시 받아(--games-status) 우천취소를 하루 1회(collect_events.yml)보다 빨리
# 반영합니다. 실행 시간은 수 초 늘 뿐이고, 실패해도 속도 수집은 계속됩니다.
# 노트북에서 git fetch origin data-collect && python scripts/import_collected.py 로 DB 에 1시간 평균으로 넣습니다.
#
# 준비: 저장소 Settings → Secrets and variables → Actions → New repository secret
#       이름 SEOUL_API_KEY, 값 = 서울 열린데이터광장 인증키
# 주의: schedule 은 기본 브랜치(main)에 이 파일이 있어야 동작합니다. GitHub 사정에 따라 몇 분~수십 분 늦게
#       실행되거나 건너뛸 수 있고, 저장소에 60일간 활동이 없으면 자동으로 꺼집니다.
name: collect-realtime

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 매시 07·22·37·52분 (정각·30분은 GitHub 예약 실행이 몰려 지연·누락이 잦음)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-realtime
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 의존성 (수집에 필요한 것만)
        run: pip install pandas pyyaml requests

      - name: data-collect 브랜치 준비
        run: |
          if git ls-remote --exit-code --heads origin data-collect; then
            git fetch origin data-collect
            git worktree add store origin/data-collect -B data-collect
          else
            git worktree add --orphan -b data-collect store
          fi

      - name: 경기 상태 (우천취소 등)
        continue-on-error: true
        run: python scripts/collect_events.py --out store/collected --games-status

      - name: 수집
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python scripts/collect_snapshot.py --out store/collected

      - name: 커밋·푸시
        if: ${{ !cancelled() }}   # 속도 수집이 실패(서울 API 무응답)해도 경기 상태는 남김
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collected
          git diff --cached --quiet && exit 0
          git commit -q -m "collect $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          # 다른 수집 워크플로가 먼저 푸시했으면 받아서 다시 올림 (서로 다른 파일이라 충돌 없음)
          for i in 1 2 3 4 5; do
            git push -q origin data-collect && exit 0
            git pull -q --rebase origin data-collect
            sleep $((i * 5))
          done
          exit 1
